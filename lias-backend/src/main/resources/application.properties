spring.application.name=lias-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lias_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT - remplacer cette valeur par une variable d'environnement en production.
jwt.secret=${JWT_SECRET:lias-development-secret-key-change-me-2026-please}
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
